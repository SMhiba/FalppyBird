<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flappy Bird Clone</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #70c5ce;
      font-family: sans-serif;
    }

    #game {
      position: relative;
      width: 400px;
      height: 600px;
      margin: 20px auto;
      background: #70c5ce;
      border: 2px solid #000;
      overflow: hidden;
    }

    #bird {
      width: 40px;
      height: 40px;
      background: yellow;
      border-radius: 50%;
      position: absolute;
      top: 200px;
      left: 50px;
    }

    .pipe {
      position: absolute;
      width: 60px;
      background: green;
    }

    .pipe.top {
      top: 0;
    }

    .pipe.bottom {
      bottom: 0;
    }

    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 24px;
      color: white;
    }
  </style>
</head>
<body>

<div id="game">
  <div id="bird"></div>
  <div id="score">Score: 0</div>
</div>

<script>
  const game = document.getElementById('game');
  const bird = document.getElementById('bird');
  const scoreDisplay = document.getElementById('score');

  let birdTop = 200;
  let gravity = 2;
  let isGameOver = false;
  let score = 0;

  function flap() {
    birdTop -= 40;
  }

  function createPipe() {
    if (isGameOver) return;

    const pipeGap = 150;
    const pipeTopHeight = Math.floor(Math.random() * 250) + 50;
    const pipeBottomHeight = 600 - pipeTopHeight - pipeGap;

    const topPipe = document.createElement('div');
    topPipe.classList.add('pipe', 'top');
    topPipe.style.height = pipeTopHeight + 'px';
    topPipe.style.left = '400px';

    const bottomPipe = document.createElement('div');
    bottomPipe.classList.add('pipe', 'bottom');
    bottomPipe.style.height = pipeBottomHeight + 'px';
    bottomPipe.style.left = '400px';

    game.appendChild(topPipe);
    game.appendChild(bottomPipe);

    let pipeLeft = 400;

    const movePipe = setInterval(() => {
      if (isGameOver) {
        clearInterval(movePipe);
        return;
      }

      pipeLeft -= 2;
      topPipe.style.left = pipeLeft + 'px';
      bottomPipe.style.left = pipeLeft + 'px';

      // Collision detection
      const birdBottom = birdTop + 40;
      if (
        pipeLeft < 90 &&
        pipeLeft + 60 > 50 &&
        (birdTop < pipeTopHeight || birdBottom > 600 - pipeBottomHeight)
      ) {
        gameOver();
        clearInterval(movePipe);
      }

      // Score increase
      if (pipeLeft === 49) {
        score++;
        scoreDisplay.innerText = 'Score: ' + score;
      }

      // Remove pipes off screen
      if (pipeLeft < -60) {
        topPipe.remove();
        bottomPipe.remove();
        clearInterval(movePipe);
      }
    }, 20);

    setTimeout(createPipe, 2000);
  }

  function gameOver() {
    alert('Game Over! Your Score: ' + score);
    isGameOver = true;
    location.reload();
  }

  function startGame() {
    const gameLoop = setInterval(() => {
      if (isGameOver) {
        clearInterval(gameLoop);
        return;
      }

      birdTop += gravity;
      bird.style.top = birdTop + 'px';

      if (birdTop > 560 || birdTop < 0) {
        gameOver();
      }
    }, 20);

    createPipe();
  }

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') flap();
  });

  document.addEventListener('click', flap);

  startGame();
</script>

</body>
</html>
